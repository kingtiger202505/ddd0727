<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报价管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>报价管理系统</h1>
            <div class="user-info">
                <span id="username">用户：<span th:text="${username}">未登录</span></span>
                <button onclick="logout()" class="btn btn-secondary">退出登录</button>
            </div>
        </header>

        <!-- 登录区域 -->
        <div id="login-section" class="section" th:if="${not isLoggedIn}">
            <h2>用户登录</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">用户名：</label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码：</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            <p>还没有账号？<a href="#" onclick="showRegister()">注册</a></p>
        </div>

        <!-- 注册区域 -->
        <div id="register-section" class="section" style="display:none;">
            <h2>用户注册</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regUsername">用户名：</label>
                    <input type="text" id="regUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">密码：</label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">邮箱：</label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary">注册</button>
                <button type="button" onclick="showLogin()" class="btn btn-secondary">返回登录</button>
            </form>
        </div>

        <!-- 报价管理区域 -->
        <div id="quotation-section" class="section" th:if="${isLoggedIn}">
            <h2>报价列表</h2>
            <button onclick="showNewQuotationForm()" class="btn btn-primary">新建报价</button>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>报价单号</th>
                            <th>客户名称</th>
                            <th>产品名称</th>
                            <th>数量</th>
                            <th>报价金额</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="quotation-list">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 新建/编辑报价表单 -->
        <div id="quotation-form-section" class="section modal" style="display:none;">
            <div class="modal-content">
                <h2 id="form-title">新建报价</h2>
                <form id="quotationForm" onsubmit="handleSaveQuotation(event)">
                    <input type="hidden" id="quotation-id">
                    <div class="form-group">
                        <label for="customer-name">客户名称：</label>
                        <input type="text" id="customer-name" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="product-name">产品名称：</label>
                        <input type="text" id="product-name" name="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">数量：</label>
                        <input type="number" id="quantity" name="quantity" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="price">单价：</label>
                        <input type="number" id="price" name="price" required min="0" step="0.01">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" onclick="closeForm()" class="btn btn-secondary">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
