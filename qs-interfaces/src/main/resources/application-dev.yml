# 开发环境配置 - 使用 H2 数据库
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:quotation_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
